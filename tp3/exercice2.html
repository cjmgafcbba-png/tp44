<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Bibliothèque</title>
    <style>
        table {
            width: 50%;
            border: 2px solid rgb(155, 76, 76);
            border-collapse: collapse;
        }
        th, td {
            border: 2px solid rgb(104, 17, 17);
            text-align: center;
        }
        img {
            width: 60px;
            height: 80px;
        }
    </style>
</head>
<body>

    <table>
        <caption>Bibliothèque</caption>
        <tr>
            <th>Image</th>
            <th>Titre</th>
            <th>Auteur</th>
            <th>Année</th>
        </tr>
        <tr>
            <td><img src="uml.jpg" alt="UML 2 par la pratique" /></td>
            <td>UML 2 par la pratique</td>
            <td>Pascal ROQUES</td>
            <td>1992</td>
        </tr>
        <tr>
            <td><img src="OIP.jfif" alt="Khan Al Khalili" /></td>
            <td>Khan Al Khalili</td>
            <td>Naguib MAHFOUDH</td>
            <td>1946</td>
        </tr>
        <tr>
            <td colspan="4">L'emprunt d'un livre ne doit pas dépasser 1 semaine</td>
        </tr>
    </table>

</body>
</html>
