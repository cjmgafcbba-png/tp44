<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Formulaire</title>
</head>

<body>

<form>

    <fieldset>
        <legend>Votre identité</legend>

        <table>
            <tr>
                <td>1. Nom</td>
                <td>
                    <input type="text" name="nom" placeholder="Prénom et nom">
                </td>
            </tr>

            <tr>
                <td>2. Email</td>
                <td>
                    <input type="email" name="email"
                           placeholder="exemple@domaine.com">
                </td>
            </tr>

            <tr>
                <td>3. Téléphone</td>
                <td>
                    <input type="tel" name="telephone"
                           placeholder="ex : +33755000000">
                </td>
            </tr>
        </table>
    </fieldset>


    <fieldset>
        <legend>Adresse de livraison</legend>

        <table>
            <tr>
                <td>1. Adresse</td>
                <td>
                    <textarea name="adresse" rows="4" cols="20"></textarea>
                </td>
            </tr>

            <tr>
                <td>2. Code postal</td>
                <td>
                    <input type="text" name="code_postal">
                </td>
            </tr>

            <tr>
                <td>3. Pays</td>
                <td>
                    <input type="text" name="pays">
                </td>
            </tr>
        </table>
    </fieldset>

    <fieldset>
        <legend>informations CB</legend>

        <table>
            <tr>
                <td>1.</td>
                <td>

                    <fieldset>
                        <legend>Type de carte bancaire</legend>

                            <ol style="list-style-type: decimal !important;">
                            
                                    
                                    <li><input type="radio"
                                           name="carte"
                                           value="visa">
                                    VISA</li>
                               

                           
                                    <li><input type="radio"
                                           name="carte"
                                           value="amex">
                                    AmEx</li>
                               

                          <li>
                                    <input type="radio"
                                           name="carte"
                                           value="mastercard">
                                    Mastercard</li></ol>
                                
                           

                    </fieldset>

                </td>
            </tr>

            <tr>
                <td>2. N° de carte</td>
                <td>
                    <input type="text" name="numero_carte">
                </td>
            </tr>

            <tr>
                <td>3. Code sécurité</td>
                <td>
                    <input type="text" name="code_securite">
                </td>
            </tr>

            <tr>
                <td>4. Nom du porteur</td>
                <td>
                    <input type="text"
                           name="nom_porteur"
                           placeholder="Même nom que sur la carte">
                </td>
            </tr>
        </table>
    </fieldset>
    <fieldset>
    <input type="submit" value="J'achète !"></fieldset>

</form>

</body>
</html>
